# Website and README card for skills/mdk-l402-api/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: money
order: 20
name: Paid APIs (L402)
tagline: Charge per request in sats with HTTP 402 — no accounts, no cards.
summary: Paid Next.js or Express APIs using HTTP 402 and Money Dev Kit Lightning payment flows.
readme: Paid Next.js or Express APIs using HTTP 402 and Money Dev Kit Lightning payment flows.
tool: Money Dev Kit
upstream: https://docs.moneydevkit.com
example_prompt: Put my /api/summarize route behind a 10-sat L402 paywall.
what_for: 'Turn an API route into a pay-per-call endpoint: callers get an HTTP 402 with a Lightning invoice,
  pay it, and retry with an L402 token.'
needs: An app with Money Dev Kit set up (@moneydevkit/nextjs or /replit); MDK_ACCESS_TOKEN and MDK_MNEMONIC
prompts:
- Put my /api/summarize route behind a 10-sat L402 paywall.
- Charge 5 US cents per call on my Express /api/premium endpoint.
- Price my image endpoint by size, in sats.
- Write an llms.txt so agents know how to pay my API.
- Test that my paid route returns 402 without payment.
caveats:
- 'Dynamic prices must be deterministic: the amount is computed at invoice creation and verification.'
- Keeps your existing validation and authorization logic inside the paid handler.
- Uses L402 rather than inventing a custom payment auth scheme.
- currency "SAT" prices in satoshis; "USD" prices in US cents.
demo:
  prompt: Put my /api/summarize route behind a 10-sat L402 paywall.
  steps:
  - kind: match
    text: 'Recognized the skill: mdk-l402-api'
  - kind: check
    text: Inspects the framework and route style, and that Money Dev Kit is already set up
  - kind: check
    text: MDK_ACCESS_TOKEN and MDK_MNEMONIC are set as server-side environment variables
  - kind: run
    text: 'Wraps the handler in withPayment({ amount: 10, currency: "SAT" }, handler)'
  - kind: caveat
    text: Secrets stay on the server, never in client code or llms.txt.
  - kind: confirm
    text: Apply the paywall to app/api/summarize/route.ts?
    action: Apply
  result: Unpaid calls get a 402 with an invoice; paid retries with an L402 token reach your handler.
music: null
