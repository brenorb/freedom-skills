# Website and README card for skills/mo-ux-vibedesign-btc/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: developer
order: 10
name: Bitcoin UX review
tagline: A senior Bitcoin UX review — copy, flows, wireframes, mockups.
summary: Senior Bitcoin UX reviews covering interviews, copy, flows, wireframes, mockups, and benchmarks.
readme: Senior Bitcoin UX reviews covering interviews, copy, flows, wireframes, mockups, and benchmarks.
tool: Bitcoin Design community practice
upstream: https://bitcoin.design
example_prompt: Review the onboarding flow of my Lightning wallet.
what_for: 'Get a senior Bitcoin UX designer''s review of your app: copy-first critique, wireframes, hi-fi
  mockups in your style, a benchmark exploration and a GitHub issue.'
needs: Screenshots or descriptions of your app's screens; Playwright to render mockups
prompts:
- Review the onboarding flow of my Lightning wallet.
- Check the copy on my send screen for jargon.
- Is our backup screen clear for non-native English speakers?
- Mock up a better receive screen in our app's own style.
- Turn this UX review into a GitHub issue.
caveats:
- Pauses after every stage and waits for your OK before moving on.
- Every stage produces a real file in your workspace; nothing is summarized or skipped.
- Checks whether copy or flows leak information or make users feel tracked.
- Reads copy as a non-native English speaker would and suggests simpler words.
demo:
  prompt: Review the onboarding flow of my Lightning wallet.
  steps:
  - kind: match
    text: 'Recognized the skill: mo-ux-vibedesign-btc'
  - kind: check
    text: 'Asks four questions first: what it does, who it''s for, desktop or mobile, which flows'
  - kind: run
    text: Reads every word on screen, then checks the 10 Bitcoin UX principles
  - kind: caveat
    text: Bitcoin mistakes are permanent, so it pushes for preventing errors rather than recovering from
      them.
  - kind: confirm
    text: Review saved to ux-review-<app>.md. Go on to Stage 2, the wireframes?
    action: Continue
  result: Next come a wireframe PNG, a hi-fi mockup, a benchmark exploration and github-issue-<app>.md.
music: null
