# Website and README card for skills/rampart-hook-configurator/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: privacy
order: 10
name: Rampart hooks
tagline: Redact personal data before it reaches the model, restore it after.
summary: Install, configure, tune, and verify the paired Rampart hooks for reducing sensitive-data exposure
  in agent workflows.
readme: Install, configure, tune, and verify the paired Rampart hooks for reducing sensitive-data exposure
  in agent workflows.
tool: Rampart hooks (this repo)
upstream: https://github.com/brenorb/freedom-skills/tree/main/hooks/rampart-pre-send
example_prompt: Set up Rampart so names and emails never reach the model.
what_for: Set up the paired Rampart hooks that redact names, emails and other personal data before a request
  reaches a hosted model, and restore them in the reply.
needs: Node.js; this repo's hooks/rampart-pre-send package (npm install); a harness that pipes payloads
  through hooks
prompts:
- Set up Rampart so names and emails never reach the model.
- Let URLs through Rampart but keep redacting everything else.
- Placeholders aren't restored in replies. Fix my session ID wiring.
- Make the pre-send hook fail closed.
- Test the Rampart round trip with one real request.
caveats:
- Both hooks need the same session id, or post-send can't restore placeholders.
- Widening keepLabels (for example adding URL) is a privacy tradeoff it will name.
- Won't recommend bypassing the pre-send hook because one label is inconvenient.
- 'Not a security boundary: an exposure-reduction layer with known miss cases.'
demo:
  prompt: Set up Rampart so names and emails never reach the model.
  steps:
  - kind: match
    text: 'Recognized the skill: rampart-hook-configurator'
  - kind: check
    text: 'Maps the boundary: what enters pre-send, what leaves post-send, where the session id comes
      from'
  - kind: run
    text: Copies the example config for this harness
    cmd: cp rampart-hooks.config.example.json rampart-hooks.config.json
  - kind: run
    text: Tests redaction on one line
    cmd: printf 'My email is ana@example.com\n' | node ./rampart-pre-send.mjs --mode text
  - kind: caveat
    text: Rampart reduces exposure but is not a security boundary; it has known miss cases.
  - kind: confirm
    text: 'Save the config with failOpen: false and one session id wired into both hooks?'
    action: Save
  result: The model sees [EMAIL_1]; the post-send hook restores the real address in the reply.
music: null
