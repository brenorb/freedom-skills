# Website and README card for skills/nsyte/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: sharing
order: 60
name: nsyte
tagline: Publish a static website on Nostr and Blossom, with no host that can take it down.
summary: Deploy, inspect, update and remove static websites (nsites) on Nostr relays and Blossom servers with the official nsyte skill.
readme: Deploying, inspecting, updating, and removing static websites (nsites) on Nostr relays and Blossom servers.
tool: nsyte
upstream: https://github.com/sandwichfarm/nsyte
example_prompt: Deploy my ./dist folder as an nsite and give me the link.
what_for: Turn a built static site into an nsite. Files go to Blossom servers, a signed manifest goes to
  Nostr relays, and any nsite gateway can serve it.
needs: The nsyte CLI (Homebrew, Scoop, AUR or a pinned release binary) and a Nostr signer, preferably a NIP-46 bunker
prompts:
- Deploy my ./dist folder as an nsite and give me the link.
- Set up nsyte for this project using my bunker.
- Show me what would be published before you deploy.
- Check whether my nsite reached all my relays and Blossom servers.
- Replace just index.html on my published site.
- Why is my nsite showing the old version?
caveats:
- Secrets (nsec, nbunksec, bunker URLs) are never printed or committed; signing goes through a bunker or an environment variable.
- Only the build directory is deployed; run nsyte scan on it first to catch leaked secrets.
- delete and undeploy are irreversible and need your explicit confirmation.
- Relays and Blossom servers come from your config; the skill does not invent endpoints.
demo:
  prompt: Deploy my ./dist folder as an nsite and give me the link.
  steps:
  - kind: match
    text: 'Recognized the skill: nsyte'
  - kind: run
    text: Scans the build for leaked secrets
    cmd: nsyte scan ./dist
  - kind: run
    text: Previews the signed events without publishing anything
    cmd: nsyte deploy ./dist --dry-run
  - kind: caveat
    text: Publishing signs a public manifest with your key; your bunker will ask you to approve it.
  - kind: confirm
    text: Publish ./dist to the relays and Blossom servers in .nsite/config.json?
    action: Publish
  - kind: run
    text: Uploads the files and publishes the manifest
    cmd: nsyte deploy ./dist
  result: The site is live at https://<npub>.nsite.lol/ and served from every configured Blossom server.
music: null
