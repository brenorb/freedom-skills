# Website and README card for skills/mdk-nextjs-checkout/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: money
order: 40
name: Next.js checkout
tagline: Add Lightning checkout to a Next.js App Router app.
summary: Money Dev Kit Lightning checkout in Next.js App Router applications.
readme: Money Dev Kit Lightning checkout in Next.js App Router applications.
tool: '@moneydevkit/nextjs'
upstream: https://docs.moneydevkit.com
example_prompt: Add a Lightning checkout button to my pricing page.
what_for: 'Add a Lightning checkout to a Next.js App Router app with Money Dev Kit: the /api/mdk route,
  a checkout button, a checkout page and success handling.'
needs: A Next.js App Router project and a Money Dev Kit account (MDK_ACCESS_TOKEN, MDK_MNEMONIC)
prompts:
- Add a Lightning checkout button to my pricing page.
- Set up Money Dev Kit checkout in my Next.js app.
- Show a thank-you page only after the payment succeeds.
- My /api/mdk route is broken. Fix the checkout setup.
- Use my Money Dev Kit product for the Pro plan checkout.
caveats:
- App Router only; Pages Router just when you explicitly ask for legacy support.
- currency "USD" is in cents; "SAT" is in satoshis.
- For product checkouts it uses Money Dev Kit product IDs, not hard-coded amounts.
- Keeps your package manager, routing and styling conventions.
demo:
  prompt: Add a Lightning checkout button to my pricing page.
  steps:
  - kind: match
    text: 'Recognized the skill: mdk-nextjs-checkout'
  - kind: check
    text: Inspects the package manager, Next.js version, app/ folder and existing payment routes
  - kind: run
    text: Installs the package
    cmd: npm install @moneydevkit/nextjs
  - kind: run
    text: Adds app/api/mdk/route.ts, the next.config plugin and a useCheckout() button
  - kind: caveat
    text: MDK_ACCESS_TOKEN and MDK_MNEMONIC stay in server-side env vars and are never committed.
  - kind: confirm
    text: Apply the checkout changes and run the app's build checks?
    action: Apply
  result: The pricing button opens a Lightning checkout page; typecheck and build pass.
music: null
