name: Test OpenTimestamps wrapper

on:
  pull_request:
    paths:
      - "skills/opentimestamps/**"
      - "tests/opentimestamps/**"
      - ".github/workflows/test-opentimestamps.yml"

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Run offline client fixtures and cancellation tests
        run: uv run --with pytest python -m pytest tests/opentimestamps -q
