name: Website

# Publishes site/ to GitHub Pages at https://freedomskills.dev on every push to main.
# The site data is regenerated from the cards in site/catalog/ first, so the published site is
# never behind the repository even before the "Site data and links" workflow commits it back.
# site/catalog/ holds source cards, not pages, so it is removed before upload.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Regenerate site data from site/catalog/
        run: uv run --with pyyaml python scripts/build_site_data.py
      - name: Links point at files that exist
        run: python3 scripts/check_site_links.py
      - name: Keep the source cards off the website
        run: rm -rf site/catalog
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
