name: Validate Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate_skills_ref.sh"
      - "scripts/check_skill_metadata.py"
      - "tests/skill_metadata/**"
      - ".githooks/pre-commit"
      - ".claude/skills/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Validate touched skills
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          mapfile -t changed_files < <(git diff --name-only "$base_sha" "$head_sha")
          ./scripts/validate_skills_ref.sh "${changed_files[@]}"

      - name: Test metadata validation and commit hook
        run: uv run --with pyyaml python -m unittest discover -s tests/skill_metadata -v

      - name: Require metadata in changed SKILL.md files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --with pyyaml python scripts/check_skill_metadata.py --base "$BASE_SHA" --head "$HEAD_SHA"
