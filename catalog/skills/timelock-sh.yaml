# Website and README card for skills/timelock-sh/. Kept out of the skill folder so it isn't installed into agents.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: privacy
order: 40
name: timelock.sh
tagline: Encrypt a file so nobody — not even you — can open it before a set time.
summary: Time-locking, inspecting, and decrypting files with timelock.sh.
readme: Time-locking, inspecting, and decrypting files with `timelock.sh`.
tool: timelock.sh
upstream: https://timelock.sh
example_prompt: Lock this letter so it can't be opened for two weeks.
what_for: Encrypt a file so nobody, you included, can open it until a chosen UTC minute up to about 30
  days ahead, using the public timelock.sh service.
needs: Python 3 and OpenSSL 3.x; network access to timelock.sh
prompts:
- Lock this letter so nobody can open it until two weeks from now.
- Time-lock answers.zip until next Friday at 09:00 UTC.
- When does this .enc file unlock?
- Decrypt letter.txt.enc. It should be open by now.
- Make a one-shot decrypt script my friend can run.
caveats:
- After the unlock minute anyone with the file can decrypt it; it isn't recipient-restricted.
- Certificates exist only about 30 days ahead; far-future dates fail before encrypting.
- Plaintext stays local; only the public certificate or released key comes from timelock.sh.
- UTC and minute-granular only; no sub-minute scheduling.
demo:
  prompt: Lock this letter so nobody can open it until two weeks from now.
  steps:
  - kind: match
    text: 'Recognized the skill: timelock-sh'
  - kind: check
    text: Picks a future UTC minute inside the roughly 30-day certificate window
  - kind: run
    text: Prepares local encryption with the bundled wrapper
    cmd: python3 scripts/timelock.py encrypt --unlock <utc-minute> --input letter.txt
  - kind: caveat
    text: 'Once the unlock minute arrives the key is public forever: this is time-locking, not private
      encryption.'
  - kind: confirm
    text: Lock letter.txt until two weeks from now, 09:00 UTC?
    action: Lock
  result: letter.txt.enc created. Decrypting early returns 425 Too Early with a retry time.
music: null
