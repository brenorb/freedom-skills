category: developer
order: 60
name: napplet-sdk
tagline: The right @napplet/sdk call for each job, with fallbacks when a domain is missing.
summary: Reference current `@napplet/sdk` calls, domains, and optional capability handling.
readme: Reference current `@napplet/sdk` calls, domains, and optional capability handling.
tool: '@napplet/sdk'
upstream: https://github.com/napplet/web
example_prompt: How do I load a user's last 20 notes in my napplet?
what_for: 'Write napplet code against the domains @napplet/sdk actually ships: outbox for reads and publishes,
  social NAPs, storage, read-only identity, resource bytes and theme, with fallbacks for optional domains.'
needs: A napplet project with @napplet/sdk installed; its installed types are the source of truth
prompts:
- How do I load a user's last 20 notes in my napplet?
- Show an avatar in my napplet without fetch.
- Save my napplet's settings without localStorage.
- Add a react button that hides when the shell has no common domain.
- Which options does outbox.publish support?
- Count reactions on a note without downloading them.
caveats:
- Uses only the domains the installed packages ship; anything else is flagged as a gap.
- The installed @napplet/sdk types, not the examples, are the source of truth for signatures.
- identity is read-only; there is no signing, encryption or window.nostr.
- relay is only for relay-local needs that outbox and the social NAPs can't express.
demo:
  prompt: How do I load a user's last 20 notes in my napplet?
  steps:
  - kind: match
    text: 'Recognized the skill: napplet-sdk'
  - kind: check
    text: Picks outbox, because relay choice affects which notes come back
  - kind: run
    text: Writes an outbox.query with authors, limit and timeoutMs, and reads each result.event
  - kind: check
    text: 'Uses only current option fields: no strategy, no subscribe live, no outbox.eose'
  - kind: caveat
    text: identity.getPublicKey() returns an empty string when signed out, so the code shows a signed-out
      state.
  - kind: confirm
    text: Add this query to src/main.ts?
    action: Apply
  result: Typed @napplet/sdk calls; the shell handles relay discovery, dedup and signature checks.
