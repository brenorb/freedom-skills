# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: developer
order: 70
name: napplet-interop
tagline: Let your napplets hand notes, profiles and DMs to each other.
summary: Implement NAP-INC and NAP-INTENT handoff, delivery, and archetype metadata.
readme: Implement NAP-INC and NAP-INTENT handoff, delivery, and archetype metadata.
tool: '@napplet/sdk'
upstream: https://github.com/napplet/web
example_prompt: Open a profile in another napplet when I click an author.
what_for: 'Connect napplets: broadcast with NAP-INC topics, ask the shell to route actions with NAP-INTENT,
  and advertise archetype roles such as napplet:note/open in the manifest.'
needs: A napplet project with @napplet/sdk; a design spec that names the cross-napplet feature
prompts:
- Open a profile in another napplet when I click an author.
- Make my napplet the handler for napplet:note/open.
- Broadcast the selected profile to sibling napplets.
- Why does my inc.on subscription never fire?
- Handle intent deliveries in my profile viewer.
caveats:
- Topics and conventions match exactly; subscribe to the queryless identity, never a queried one.
- Every received payload is untrusted and gets validated before use.
- An accepted intent means the runtime took the request, not that delivery finished.
- inc and intent stay optional; the affordance hides when the domain is absent.
demo:
  prompt: Open a profile in another napplet when I click an author.
  steps:
  - kind: match
    text: 'Recognized the skill: napplet-interop'
  - kind: check
    text: Uses the queryless convention napplet:profile/open
  - kind: run
    text: Dispatches intent.open with the pubkey in the payload and checks ok
  - kind: run
    text: In the profile napplet, records the archetype role
    cmd: napplet init --archetype napplet:profile/open
  - kind: caveat
    text: Acceptance isn't delivery; the target validates the payload in intent.onDelivery.
  - kind: confirm
    text: Add the handoff to both napplets?
    action: Apply
  result: Clicking an author asks the shell to open that profile in a napplet that advertises profile/open.
