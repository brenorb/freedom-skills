[project]
name = "freedom-skills-blossom-cli"
version = "0.1.0"
description = "uvx wrapper for the Rust blossom-cli client"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blossom = "blossom_uvx:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blossom_uvx"]
