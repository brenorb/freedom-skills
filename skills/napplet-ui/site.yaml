# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: developer
order: 40
name: napplet-ui
tagline: Napplet layouts with no title header that work from tiny widget to full screen.
summary: Design applet interfaces that work from compact widgets to full panes.
readme: Design applet interfaces that work from compact widgets to full panes.
tool: '@napplet/cli'
upstream: https://github.com/napplet/web
example_prompt: Make my napplet look right at any size.
what_for: 'Lay out a napplet like software, not a website: compact density, a layout that stays good from
  a widget tile to a full-screen pane, and the host theme painted across the whole surface.'
needs: A napplet project (index.html, src/styles.css); Paja or the browser device toolbar to resize the
  frame
prompts:
- Make my napplet look right at any size.
- Remove the title header and website layout from my napplet.
- Make my napplet usable as a 200×160 widget.
- My napplet is a narrow column on wide screens; use the space.
- Apply the host theme to my napplet in dark and light.
- Add a minimum-size notice to my chess board napplet.
caveats:
- Never renders the napplet's own name, tagline or masthead; the runtime shows the name.
- Checked at four frames (200×160, 320×560, 900×600, the largest) in dark and light themes.
- A minimum size is declared only when the UI truly breaks; feeds, lists and composers have none.
- Theme colors paint html, body and the app root, not just the panels.
demo:
  prompt: Make my napplet look right at any size.
  steps:
  - kind: match
    text: 'Recognized the skill: napplet-ui'
  - kind: check
    text: 'Looks for the three usual bugs: a title header, a centered website column, one tested width'
  - kind: run
    text: Replaces the page layout with a full-frame root, compact tokens and container-query tiers
  - kind: run
    text: Applies the theme's background, text and primary to html, body and root, with a fallback palette
  - kind: caveat
    text: If it looks the same at 600px and 2400px it isn't done; wide frames get more rows, columns and
      detail.
  - kind: confirm
    text: Run the four-frame check in dark and light?
    action: Run
  result: The UI holds at 200×160, 320×560, 900×600 and the largest frame, in both themes.
music: null
