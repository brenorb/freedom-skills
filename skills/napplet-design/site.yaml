# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: developer
order: 30
name: napplet-design
tagline: Turn an app idea into a safe napplet build spec before any code.
summary: Plan safe, conformant sandboxed Nostr napplets before implementation.
readme: Plan safe, conformant sandboxed Nostr napplets before implementation.
tool: '@napplet/cli'
upstream: https://github.com/napplet/web
example_prompt: Plan a napplet for a shared reading list.
what_for: 'Turn a napplet idea into a short build spec before any code: which shipped NAP domain owns
  each feature, hard requires versus optional fallbacks, size tiers, theme and data flow.'
needs: Just the app idea; nothing to install
prompts:
- Plan a napplet for a shared reading list.
- Which NAPs does a DM inbox napplet need?
- Design a note composer that still works as a tiny widget.
- Should my napplet's feed use relay or outbox?
- Which domains should my bookmarks napplet require, and which stay optional?
caveats:
- Writes no app code; the output is a spec for napplet-build.
- relay is only a named escape hatch; social reads and publishes go through outbox.
- Every NAP is voluntary, so each optional domain gets a named fallback.
- No title header, and the layout must work from a tiny widget to full screen.
demo:
  prompt: Plan a napplet for a shared reading list.
  steps:
  - kind: match
    text: 'Recognized the skill: napplet-design'
  - kind: check
    text: 'Maps each feature to a shipped NAP: lists for list edits, outbox for reads, storage for state'
  - kind: run
    text: Splits hard requires from optional domains, each with a fallback
  - kind: run
    text: Plans the tiny, compact, regular and wide tiers plus whole-surface theming
  - kind: caveat
    text: Anything that needs fetch, localStorage or signing inside the napplet gets redesigned or flagged
      as a gap.
  - kind: confirm
    text: Hand this spec to napplet-build?
    action: Continue
  result: 'A spec block: napplet type, NAPs used, requires, fallbacks, tiers, theme, states and data flow.'
music: null
