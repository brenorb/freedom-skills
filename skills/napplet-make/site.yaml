# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: developer
order: 20
name: napplet-make
tagline: Go from one prompt to a working, tested Nostr napplet.
summary: Entrypoint for creating a complete napplet end to end from one prompt using the other skills.
readme: '**Entrypoint** for creating a complete napplet end to end from one prompt using the other skills.'
tool: '@napplet/cli'
upstream: https://github.com/napplet/web
example_prompt: Make a napplet that shows my friends' latest long-form posts.
what_for: Turn an idea into a working, conformant napplet, a small sandboxed Nostr app framed by a shell,
  by routing through design, UI, build and test, and ending with an evidence report.
needs: napplet CLI (@napplet/cli 0.13.0) and pnpm; Kehto/Paja for a runtime preview
prompts:
- Make a napplet that shows my friends' latest long-form posts.
- Build a napplet for bookmarking notes.
- Make a tiny napplet that shows my follower count.
- Add a mute button to my existing napplet.
- Port my Nostr widget into a napplet, end to end.
caveats:
- Napplet code gets no fetch, browser storage, WebSocket or window.nostr; the shell owns them.
- Not done until pnpm verify and pnpm test:conformance pass and the UI holds at four frame sizes in dark
  and light.
- A raw Vite URL is never presented as a preview; only the Paja URL counts.
- If a feature needs a NAP the packages don't ship, it stops and flags the gap.
demo:
  prompt: Make a napplet that shows my friends' latest long-form posts.
  steps:
  - kind: match
    text: 'Recognized the skill: napplet-make'
  - kind: run
    text: Scaffolds the project from the maintained boilerplate
    cmd: napplet create friends-longform
  - kind: run
    text: Writes the deployment metadata
    cmd: napplet init
  - kind: check
    text: 'Writes the brief: one job, must-have flows, sizes it must survive, known gaps'
  - kind: run
    text: Builds and runs conformance
    cmd: pnpm verify && pnpm test:conformance
  - kind: caveat
    text: Feed reads and publishes go through outbox; relay is only a named escape hatch.
  - kind: confirm
    text: Open a runtime preview through Paja?
    action: Preview
  result: 'An evidence report: changed files, NAPs used, frames and themes checked, commands run, open gaps.'
music: null
