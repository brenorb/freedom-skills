# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: privacy
order: 20
name: Security audit
tagline: Multi-phase security audits with independent verification.
summary: Cloudflare's multi-phase codebase security audits with independent verification, coverage tracking,
  and structured findings.
readme: Cloudflare’s multi-phase codebase security audits with independent verification, coverage tracking,
  and structured findings.
tool: Cloudflare security-audit-skill
upstream: https://github.com/cloudflare/security-audit-skill
example_prompt: Run a full security audit of this repo and write up the findings.
what_for: 'Get a source-first security review of a codebase: real trust-boundary vulnerabilities with
  evidence, priority and the smallest fix, from a quick question to a full report.'
needs: A local checkout of the code; an OS-enforced sandbox if any target code must run
prompts:
- Run a full security audit of this repo and write up the findings.
- Is this login handler vulnerable to an auth bypass?
- Do a quick-profile audit of just the src/api folder.
- Review this webhook endpoint for cross-tenant data leaks.
- Re-run the audit and carry over last run's findings.
caveats:
- Never probes deployed endpoints, production identities or other users' data.
- Only confirmed findings get a severity; needs_validation records have none.
- Describes the smallest fix for each finding but doesn't modify your source.
- A quick or scoped run is reported as partial coverage, never as a clean bill.
demo:
  prompt: Run a full security audit of this repo and write up the findings.
  steps:
  - kind: match
    text: 'Recognized the skill: security-audit'
  - kind: check
    text: You asked for a full audit, so it runs all six phases instead of guidance mode
  - kind: run
    text: Records the target, source commit and an output folder outside the repo
  - kind: caveat
    text: Target code only runs in an OS-enforced sandbox with no network; otherwise it's marked needs_validation.
  - kind: confirm
    text: Start a standard audit writing to ~/security-audit-skill/my-app/run-1?
    action: Run
  result: REPORT.md, FINDINGS-DETAIL.md and NEEDS-VALIDATION.md written after both validators pass.
music: null
