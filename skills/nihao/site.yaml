# Website and README card for this skill. Agents don't load this file.
# scripts/build_site_data.py turns it into the site's data, the README table and the skill pages.
category: communication
order: 30
name: nihao
tagline: Create a complete Nostr identity in one command, or score an existing one 0–8.
summary: Nostr identity setup and health checks, with optional Cashu wallet configuration.
readme: Nostr identity setup and health checks, with optional Cashu wallet configuration.
tool: nihao
upstream: https://github.com/dergigi/nihao
example_prompt: Check how healthy my npub is and tell me what to fix.
what_for: Create a complete Nostr identity in one command (profile, relays, lightning address, Cashu wallet)
  or score an existing npub's health and see what's missing.
needs: Go 1.21+ to build nihao (go install github.com/dergigi/nihao@latest)
prompts:
- Check how healthy my npub is and tell me what to fix.
- Create a Nostr identity for my bot called Scout and save the key safely.
- Back up my Nostr profile and relay lists to identity.json.
- Is my NIP-05 and lightning address actually working?
- Check my npub using only my own relays.
caveats:
- The nsec cannot be recovered if lost; use --nsec-file or --nsec-cmd to store it.
- Avoid passing a raw nsec as an argument; prefer --stdin or --nsec-cmd.
- 'Setup publishes your profile, relay lists, follows and a first #nihao note to public relays.'
- Built from source with go install; no pre-built binaries are downloaded.
demo:
  prompt: Check how healthy my npub is and tell me what to fix.
  steps:
  - kind: match
    text: 'Recognized the skill: nihao'
  - kind: run
    text: Runs the health check
    cmd: nihao check npub1... --json
  - kind: check
    text: 'Reads each check: profile, NIP-05, picture, lightning address, relay lists, DM relays, wallet'
  - kind: caveat
    text: Exit code 1 means one or more checks failed; 0 means every check passed.
  - kind: result
    text: 'Score 6/8. Not passing: nip05 (not set) and DM relay list (kind 10050).'
  result: A scored report with each check's status and detail, so you know which fixes come first.
music: null
